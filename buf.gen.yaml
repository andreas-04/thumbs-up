version: v2
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: github.com/andreas-04/terra-crate/backend/gen
plugins:
  # Go server types
  - local: protoc-gen-go
    out: backend/gen
    opt: paths=source_relative
  # TypeScript client types (JSON shapes match the wire exactly)
  - remote: buf.build/bufbuild/es
    out: frontend/src/gen
    include_imports: true
    opt:
      - target=ts
      - json_types=true
